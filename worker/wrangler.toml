name = "lucy-api"
main = "index.js"
compatibility_date = "2026-10-15"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://sinlavi.github.io"
TURNSTILE_HOSTNAME = "sinlavi.github.io"
GITHUB_OWNER = "sinlavi"
GITHUB_REPO = "lucy"
GITHUB_WORKFLOW = "process-authorized-audio.yml"
GITHUB_REF = "main"
GITHUB_APP_ID = "5334236"
GITHUB_INSTALLATION_ID = "171810372"

[[kv_namespaces]]
binding = "JOBS"
id = "4f0ab80dc29c48e3bad9862b63ce64b9"

[[unsafe.bindings]]
name = "REQUEST_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 3, period = 60 }
