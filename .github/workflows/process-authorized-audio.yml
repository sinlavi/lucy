name: Process authorized audio
run-name: Lucy audio ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      track_id:
        description: Numeric iTunes track ID
        required: true
        type: string
      quality:
        description: MP3 bitrate
        required: true
        default: "192"
        type: choice
        options:
          - "128"
          - "192"
          - "256"
          - "320"
      request_id:
        description: UUID generated by the Lucy API
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: process-audio-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate workflow inputs
        env:
          TRACK_ID: ${{ inputs.track_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [[ "$TRACK_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$REQUEST_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js for yt-dlp EJS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Write YouTube cookies to runner temp
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          test -n "$YOUTUBE_COOKIES"
          umask 077
          printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/lucy-cookies.txt"

      - name: Search, match, download, and tag
        id: process
        env:
          ITUNES_TRACK_ID: ${{ inputs.track_id }}
          AUDIO_QUALITY: ${{ inputs.quality }}
          YOUTUBE_COOKIES_FILE: ${{ runner.temp }}/lucy-cookies.txt
          YOUTUBE_ALLOWED_CHANNEL_IDS: ${{ vars.YOUTUBE_ALLOWED_CHANNEL_IDS }}
          RELEASE_TAG: audio-${{ inputs.request_id }}
        run: python scripts/process_audio.py

      - name: Remove YouTube cookies
        if: always()
        run: rm -f "$RUNNER_TEMP/lucy-cookies.txt"

      - name: Publish downloadable release asset
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: audio-${{ inputs.request_id }}
          name: Lucy audio ${{ inputs.request_id }}
          draft: false
          prerelease: false
          make_latest: false
          files: dist/*.mp3

      - name: Report status to Lucy API
        if: always()
        continue-on-error: true
        env:
          CALLBACK_URL: ${{ vars.LUCY_WORKER_URL }}
          CALLBACK_TOKEN: ${{ secrets.LUCY_CALLBACK_TOKEN }}
          REQUEST_ID: ${{ inputs.request_id }}
          JOB_STATUS: ${{ job.status }}
          ASSET_URL: ${{ steps.process.outputs.asset_url }}
        run: |
          test -n "$CALLBACK_URL" && test -n "$CALLBACK_TOKEN" || exit 0
          if [[ "$JOB_STATUS" == "success" ]]; then
            STATUS="ready"
          else
            STATUS="failed"
          fi
          jq -n --arg status "$STATUS" --arg download_url "$ASSET_URL" '{status: $status, download_url: $download_url}' > "$RUNNER_TEMP/callback.json"
          curl --fail --silent --show-error --max-time 15 \
            -X POST "$CALLBACK_URL/api/internal/jobs/$REQUEST_ID" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/callback.json"